name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

      - name: Tests (pytest)
        run: pytest

      - name: Benchmark regression (committed snapshot history)
        # Diffs the two most recent committed benchmark snapshots with the
        # existing tooling (`benchmark_report --diff` exits non-zero when the
        # newer snapshot regresses). A full engine-vs-snapshot regression run
        # cannot run in CI yet: benchmark_runner drives live web collection
        # through the real evidence orchestrator, so outputs are
        # non-reproducible offline and would not match these snapshots.
        run: python -m benchmarks.benchmark_report --diff 0.12.0 0.13.0