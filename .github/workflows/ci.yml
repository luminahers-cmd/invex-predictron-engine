name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

      - name: Tests (pytest)
        run: pytest

      - name: Benchmark regression (committed snapshot history)
        # Diffs the two most recent committed benchmark snapshots with the
        # existing tooling (`benchmark_report --diff` exits non-zero when the
        # newer snapshot regresses). A full engine-vs-snapshot regression run
        # cannot run in CI yet: benchmark_runner drives live web collection
        # through the real evidence orchestrator, so outputs are
        # non-reproducible offline and would not match these snapshots.
        # The pair is auto-discovered from the committed tree so a newly
        # committed snapshot is diffed without editing this workflow.
        run: |
          set -euo pipefail
          readarray -t sorted < <(git ls-tree -r --name-only HEAD benchmarks/expected_outputs/ \
            | grep 'snapshot_v.*\.json$' | sort -V)
          total=${#sorted[@]}
          if [ "$total" -lt 2 ]; then
            echo "Expected at least 2 committed snapshots, found $total"
            exit 0
          fi
          prev=${sorted[$((total - 2))]##*/}
          last=${sorted[$((total - 1))]##*/}
          prev=${prev#snapshot_v}; prev=${prev%.json}
          last=${last#snapshot_v}; last=${last%.json}
          echo "Diffing committed snapshots: $prev -> $last"
          python -m benchmarks.benchmark_report --diff "$prev" "$last"