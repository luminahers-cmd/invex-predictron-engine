[project]
name = "predictron-engine"
version = "0.12.1"
description = "Deterministic, explainable venture intelligence pipeline for InveX AI."
requires-python = ">=3.12"
license = { text = "MIT" }

[project.scripts]
predictron-dataset = "predictron_engine.dataset.cli:main"
predictron-benchmark = "benchmarks.ground_truth_eval.cli:main"
predictron-feature = "predictron_engine.feature_store.cli:main"
predictron-decision = "predictron_engine.decision.cli:main"
predictron-monitor = "app.monitoring_cli:main"
predictron-learning = "app.learning_cli:main"
predictron-learning-eval = "benchmarks.learning_eval.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"predictron_engine/evidence/providers/*.py" = ["E501"]
"predictron_engine/extraction/extractors/*.py" = ["E501"]
"predictron_engine/extraction/derived/*.py" = ["E501"]
"predictron_engine/extraction/quantitative/*.py" = ["E501"]
"tests/engine/test_scoring/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["predictron_engine", "app", "benchmarks", "predictron_sdk"]
exclude = ["^alembic/"]

[[tool.mypy.overrides]]
module = ["benchmarks.*", "app.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["app.main", "app.api.*"]
check_untyped_defs = false
